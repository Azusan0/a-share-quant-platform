<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个股详情 · A股交易 Agent</title>
<style>
:root{color-scheme:dark;--bg:#07111e;--panel:#0e1c2c;--panel2:#12243a;--text:#edf4ff;--muted:#8fa6bd;--line:#223950;--blue:#59a6ff;--green:#3dd6a3;--amber:#f6bd55;--red:#ff7187;--purple:#aa8cff;--up:#ff6b81;--down:#3dd6a3;--buy-bg:rgba(61,214,163,.10);--supply-bg:rgba(246,189,85,.11)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#153458 0,transparent 36%),radial-gradient(circle at 90% 6%,rgba(89,166,255,.13) 0,transparent 34%),var(--bg);color:var(--text);font-family:"Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--blue);text-decoration:none}button{font:inherit}.shell{max-width:1180px;margin:auto;padding:18px 18px 62px}.topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}.back,.status{font-size:13px}.status,.muted{color:var(--muted)}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start;margin:8px 0 16px}.id b{font-size:28px}.id span{color:var(--muted);font-size:13px;margin-left:8px}.tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.tag,.badge{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--muted)}.badge.buy,.tag.good{color:var(--green);border-color:rgba(61,214,163,.45);background:rgba(61,214,163,.08)}.badge.trim,.tag.warn{color:var(--amber);border-color:rgba(246,189,85,.45);background:rgba(246,189,85,.08)}.badge.exit,.tag.bad{color:var(--red);border-color:rgba(255,113,135,.45);background:rgba(255,113,135,.08)}.px{text-align:right}.px .p{font-size:32px;font-weight:850;font-variant-numeric:tabular-nums}.px .c{font-size:14px;font-weight:700}.up{color:var(--up)}.down{color:var(--down)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}.card{background:linear-gradient(180deg,rgba(18,36,58,.96),rgba(13,28,45,.96));border:1px solid var(--line);border-radius:17px;box-shadow:0 16px 38px rgba(0,0,0,.18)}.decision{padding:16px;margin-bottom:16px;border-left:4px solid var(--blue)}.decision.buy{border-left-color:var(--green)}.decision.trim{border-left-color:var(--amber)}.decision.exit{border-left-color:var(--red)}.decision-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.decision-h .act{font-size:20px;font-weight:850}.decision-h .meta{margin-left:auto;font-size:12px;color:var(--muted)}
.grid,.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:13px}.metric{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.045);border-radius:11px;padding:9px 10px;min-height:58px}.metric .k{font-size:11px;color:var(--muted)}.metric .v{font-size:15px;font-weight:750;margin-top:3px;font-variant-numeric:tabular-nums}.metric.danger .v{color:var(--red)}.reasons{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:11px}
.signal-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}.signal{padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}.signal .row{display:flex;align-items:center;gap:8px}.signal .row b{font-size:14px}.signal .row .price{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}.signal p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
.chart-card{padding:14px;margin-bottom:16px}.chart-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.chart-head h2{font-size:15px;margin:0}.chart-actions{margin-left:auto;display:flex;gap:6px}.pill{border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer;font-size:12px}.pill.active{color:var(--text);border-color:var(--blue);background:#18375a}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:4px 0 8px}.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;margin-right:4px;vertical-align:middle}.legend .sw{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}canvas{width:100%;height:360px;display:block;border-radius:10px;background:rgba(0,0,0,.08)}.note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.tabs{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13px}.tabs button.active{color:var(--text);border-color:var(--blue);background:#18375a}.pane{display:none}.pane.active{display:block}.panel{padding:16px;margin-bottom:14px}.evi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.evi-box{background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.045);border-radius:12px;padding:11px}.evi-box h4{margin:0 0 8px;font-size:13px}.evi-box ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.8}.side{display:grid;gap:14px}.side .panel{margin:0}.side h3,.panel h3{margin:0 0 11px;font-size:15px}.side-list{display:grid;gap:9px}.side-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.055);font-size:12.5px}.side-row:last-child{border-bottom:0}.side-row span:first-child{color:var(--muted)}
.table{width:100%;border-collapse:collapse;font-size:12.5px}.table th{color:var(--muted);font-weight:400;text-align:left;padding:8px;border-bottom:1px solid var(--line)}.table td{padding:9px 8px;border-bottom:1px solid rgba(34,57,80,.55);vertical-align:top}.num{text-align:right;font-variant-numeric:tabular-nums}.empty{color:var(--muted);text-align:center;padding:18px}.history-head{display:flex;gap:14px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.history-head .big{font-size:28px;font-weight:850;color:var(--green)}.error{padding:18px;border:1px solid rgba(255,113,135,.4);background:rgba(255,113,135,.08);border-radius:14px;color:#ffd7de}.footer{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.7}
@media(max-width:920px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.grid,.kv{grid-template-columns:repeat(2,1fr)}.signal-strip{grid-template-columns:1fr}.hd{grid-template-columns:1fr}.px{text-align:left}}@media(max-width:640px){.side{grid-template-columns:1fr}.evi{grid-template-columns:1fr}.grid,.kv{grid-template-columns:1fr}.shell{padding:14px 12px 48px}.id b{font-size:23px}.px .p{font-size:26px}canvas{height:300px}}
</style>
</head>
<body>
<main class="shell">
  <div class="topbar"><a class="back" href="/">← 返回交易 Agent 首页</a><div class="status" id="status">正在读取个股数据…</div></div>
  <div id="error" class="error" style="display:none"></div>
  <section id="content" style="display:none">
    <div class="hd"><div class="id"><b id="s-name">—</b><span id="s-code">—</span><div class="tags" id="s-tags"></div></div><div class="px"><div class="p" id="s-price">—</div><div class="c" id="s-chg">—</div></div></div>
    <div class="layout">
      <div>
        <div class="card decision" id="decision"><div class="decision-h"><div class="act" id="decision-action">—</div><div class="meta" id="decision-meta">—</div></div><div class="grid" id="decision-grid"></div><div class="reasons" id="decision-reasons"></div></div>
        <div class="signal-strip" id="signal-strip"></div>
        <div class="card chart-card"><div class="chart-head"><h2 id="chart-title">K线 · 关键价位叠加</h2><div class="chart-actions"><button class="pill active" data-period="1d">日线</button><button class="pill" data-period="5m">5分钟</button></div></div><div class="legend"><span><span class="sw" style="background:var(--buy-bg);border:1px solid var(--green)"></span>买入/关注区间</span><span><i style="border-color:var(--red)"></i>失效价</span><span><i style="border-color:var(--blue)"></i>目标价</span><span><i style="border-color:var(--muted);border-top-style:dashed"></i>支撑/压力</span><span><span class="sw" style="background:var(--supply-bg);border:1px solid var(--amber)"></span>上方套牢区</span></div><canvas id="kline"></canvas><div class="note">价格区间来自推荐引擎、实时操作提示和诊股模块。只做盯盘和决策辅助，不会自动下单。</div></div>
        <div class="tabs" id="tabs"><button class="active" data-tab="tech">技术面</button><button data-tab="fund">基本面与风险</button><button data-tab="board">板块与海外因子</button><button data-tab="hist">历史推荐表现</button><button data-tab="acct">账户持仓</button></div>
        <div class="pane active" id="pane-tech"><div class="card panel" id="tech-panel"></div></div><div class="pane" id="pane-fund"><div class="card panel" id="fund-panel"></div></div><div class="pane" id="pane-board"><div class="card panel" id="board-panel"></div></div><div class="pane" id="pane-hist"><div class="card panel" id="hist-panel"></div></div><div class="pane" id="pane-acct"><div class="card panel" id="acct-panel"></div></div>
      </div>
      <aside class="side"><div class="card panel"><h3>当前价位框架</h3><div class="side-list" id="level-list"></div></div><div class="card panel"><h3>今日执行提醒</h3><div class="side-list" id="action-list"></div></div><div class="card panel"><h3>数据可信度</h3><div class="side-list" id="quality-list"></div></div></aside>
    </div>
  </section>
  <div class="footer">本页数据来自真实详情和行情接口；所有内容均为影子模式监控建议，不代表确定预测，也不会连接券商自动下单。</div>
</main>
<script>
var $=function(id){return document.getElementById(id);};
var params=new URLSearchParams(location.search),symbol=(params.get("symbol")||"").trim();
var DETAIL=null,BARS=[],LEVELS={},PERIOD="1d";
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m];});}
function num(v){if(v===null||v===undefined||v==="")return null;var n=Number(String(v).replace(/[% ,]/g,""));return Number.isFinite(n)?n:null;}
function firstNum(){for(var i=0;i<arguments.length;i++){var n=num(arguments[i]);if(n!==null)return n;}return null;}
function f(v,d){var n=num(v);return n===null?"—":n.toFixed(d==null?2:d);}
function fp(v,d){var n=num(v);return n===null?"—":n.toFixed(d==null?1:d)+"%";}
function fm(v){var n=num(v);return n===null?"—":Math.round(n).toLocaleString("zh-CN");}
function arr(v){return Array.isArray(v)?v:(v?[v]:[]);}
function tagName(t){return typeof t==="string"?t:(t&&t.name||t&&t.concept||t&&t.label||t&&t.board||"");}
function trendLabel(t){var m={bullish:"多头",bearish:"空头",mixed:"震荡",unknown:"未知",strong:"强趋势",weak:"弱趋势"};return m[t]||t||"—";}
function actionClass(a){return ["buy","add","entry_zone"].indexOf(a)>=0?"buy":(["trim","protect"].indexOf(a)>=0?"trim":(["exit","sell"].indexOf(a)>=0?"exit":"hold"));}
function actionText(a){var m={buy:"可分批买入",add:"可加仓观察",entry_zone:"等待进入计划区",trim:"趋势转弱，考虑减仓",protect:"提高警戒，防回撤",exit:"跌破失效，优先退出",sell:"卖出/止损",hold:"继续持有/观察"};return m[a]||"继续观察";}
function statusText(s){var m={recommend:"推荐",watch:"观察",reject:"过滤",target_hit:"目标触达",invalidated:"失效",entry_reached:"已触达入场",active:"跟踪中"};return m[s]||s||"—";}
function primarySignal(){return arr(DETAIL&&DETAIL.signals)[0]||{};}function recommendation(){return DETAIL&&DETAIL.recommendation||{};}function diagnosis(){return DETAIL&&DETAIL.diagnosis||{};}function fundamentalWrap(){return DETAIL&&DETAIL.fundamental||{};}function fundamental(){var w=fundamentalWrap();return w.fundamental||{};}function accounts(){return arr(DETAIL&&DETAIL.accounts);}function history(){return DETAIL&&DETAIL.history||{};}
function validSymbol(s){return s.length===6&&s.split("").every(function(ch){return ch>="0"&&ch<="9";});}
async function getJson(url){var r=await fetch(url,{cache:"no-store"});if(!r.ok){var msg="";try{msg=(await r.json()).detail||"";}catch(e){msg=await r.text();}throw new Error(msg||("HTTP "+r.status));}return r.json();}
function buildLevels(){var rec=recommendation(),sig=primarySignal(),d=diagnosis(),supply=d.overhead_supply_zone||{};LEVELS={entry_low:firstNum(sig.entry_low,rec.entry_low),entry_high:firstNum(sig.entry_high,rec.entry_high),max_chase:firstNum(sig.max_chase,rec.max_chase_price),invalid:firstNum(sig.invalid,rec.invalid_price),target:firstNum(sig.target,rec.target_price),support:firstNum(d.support_price,DETAIL&&DETAIL.support_price,rec.support_price),resistance:firstNum(d.resistance_price,DETAIL&&DETAIL.resistance_price,rec.resistance_price),supply_low:firstNum(supply.low),supply_high:firstNum(supply.high)};}
function latestPrice(){var last=BARS[BARS.length-1]||{},pos=accounts()[0]||{};return firstNum(primarySignal().price,recommendation().price,last.c,pos.current_price);}
function stockName(){return DETAIL&&DETAIL.name||recommendation().name||accounts()[0]&&accounts()[0].name||symbol;}function sectorName(){return DETAIL&&DETAIL.sector||recommendation().sector||accounts()[0]&&accounts()[0].sector||"—";}
function metricGrid(items){var html='<div class="kv">';items.forEach(function(x){html+='<div class="metric '+esc(x[2]||"")+'"><div class="k">'+esc(x[0])+'</div><div class="v">'+x[1]+'</div></div>';});return html+"</div>";}
function evidenceBox(title,items,color){var list=items.length?items:["暂无"];return '<div class="evi-box"><h4 style="color:var(--'+color+')">'+esc(title)+'</h4><ul>'+list.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+"</ul></div>";}
function renderHeader(){var price=latestPrice(),prev=BARS.length>1?num(BARS[BARS.length-2].c):null,chg=price!==null&&prev?((price/prev-1)*100):null;$("s-name").textContent=stockName();$("s-code").textContent=symbol+" · "+sectorName();$("s-price").textContent=f(price,2);$("s-price").className="p "+(chg===null?"":chg>=0?"up":"down");$("s-chg").textContent=chg===null?"等待行情更新":(chg>=0?"+":"")+chg.toFixed(2)+"%  日线参考";$("s-chg").className="c "+(chg===null?"":chg>=0?"up":"down");var tags=[sectorName()].concat(arr(DETAIL&&DETAIL.concepts&&DETAIL.concepts.concept_tags).map(tagName).filter(Boolean).slice(0,5));var fw=fundamentalWrap();if(fw.risk_level)tags.push("基本面风险："+fw.risk_level);if(diagnosis().trend)tags.push("趋势："+trendLabel(diagnosis().trend));$("s-tags").innerHTML=tags.filter(Boolean).map(function(t,i){return '<span class="tag '+(i===0?"good":"")+'">'+esc(t)+"</span>";}).join("");}
function renderDecision(){var rec=recommendation(),sig=primarySignal(),action=sig.action||(rec.recommendation_status==="recommend"?"buy":rec.recommendation_status==="watch"?"entry_zone":"hold"),klass=actionClass(action);$("decision").className="card decision "+klass;$("decision-action").innerHTML='<span class="badge '+klass+'">'+esc(actionText(action))+"</span>";var conf=firstNum(sig.confidence,rec.recommendation_score),role=sig.role||rec.role||rec.state||"—";$("decision-meta").textContent=statusText(rec.recommendation_status)+" · "+role+" · 置信/评分 "+(conf===null?"—":conf.toFixed(0));var rr=firstNum(sig.rr,rec.risk_reward);var grid=[["买入/关注区间",LEVELS.entry_low!==null||LEVELS.entry_high!==null?f(LEVELS.entry_low)+" - "+f(LEVELS.entry_high):"—",""],["最大追价",f(LEVELS.max_chase),""],["失效价",f(LEVELS.invalid),"danger"],["目标价 / RR",f(LEVELS.target)+" / "+(rr===null?"—":rr.toFixed(1)),""],["建议仓位",sig.pos_pct!=null?f(sig.pos_pct,1)+"% · "+(sig.shares||"—")+"股":"按账户风控计算",""],["最大计划亏损",sig.max_loss!=null?fm(sig.max_loss):"—","danger"],["支撑 / 压力",f(LEVELS.support)+" / "+f(LEVELS.resistance),""],["当前账户",accounts().length?accounts().length+"个账户持有/关注":"未在持仓中",""]];$("decision-grid").innerHTML=grid.map(function(x){return '<div class="metric '+x[2]+'"><div class="k">'+esc(x[0])+'</div><div class="v">'+esc(x[1])+"</div></div>";}).join("");var reasons=arr(sig.reasons).concat(arr(rec.reasons),arr(diagnosis().support_evidence)).filter(Boolean).slice(0,6);$("decision-reasons").innerHTML=reasons.length?"依据："+reasons.map(esc).join(" · "):"暂无足够证据，保持观察。";}
function renderSignals(){var list=arr(DETAIL&&DETAIL.signals).slice(0,4);$("signal-strip").innerHTML=list.length?list.map(function(s){var k=actionClass(s.action),reason=Array.isArray(s.reasons)?s.reasons.join(" · "):s.reasons;return '<div class="signal"><div class="row"><span class="badge '+k+'">'+esc(actionText(s.action))+"</span><b>"+esc(s.scenario||s.type||"实时提示")+'</b><span class="price">'+f(s.price)+"</span></div><p>"+esc(reason||"暂无补充说明")+"</p></div>";}).join(""):'<div class="signal"><div class="row"><span class="badge">暂无实时操作提示</span></div><p>当前没有买入、减仓或失效提示，继续按监控池轮换观察。</p></div>';}
function renderTech(){var d=diagnosis(),m=d.metrics||{};$("tech-panel").innerHTML="<h3>技术面诊断</h3>"+metricGrid([["技术分",esc(f(d.technical_score||(DETAIL&&DETAIL.technical_score),1))],["趋势结构",esc(trendLabel(d.trend||(DETAIL&&DETAIL.trend))+" / 短:"+trendLabel(d.trend_periods&&d.trend_periods.short)+" 中:"+trendLabel(d.trend_periods&&d.trend_periods.medium)+" 长:"+trendLabel(d.trend_periods&&d.trend_periods.long))],["ATR14 / 波动率",esc(f(m.atr14_pct,2)+"% / "+f(m.volatility20_pct,1)+"%")],["5日涨幅",'<span class="'+(num(m.return5_pct)>=0?"up":"down")+'">'+fp(m.return5_pct)+"</span>"],["MA5/10/20/60",esc(f(m.ma5)+" / "+f(m.ma10)+" / "+f(m.ma20)+" / "+f(m.ma60))],["最近支撑",esc((d.support_name||"支撑")+" "+f(d.support_price)+" ("+fp(d.support_distance_pct)+")")],["最近压力",esc((d.resistance_name||"压力")+" "+f(d.resistance_price)+" ("+fp(d.resistance_distance_pct)+")")],["套牢区",esc(LEVELS.supply_low!==null?f(LEVELS.supply_low)+" - "+f(LEVELS.supply_high):"暂无明显近端套牢区")]])+'<div class="evi">'+evidenceBox("支持证据",arr(d.support_evidence),"green")+evidenceBox("反对/风险证据",arr(d.opposing_evidence),"amber")+evidenceBox("缺失数据",arr(d.missing_data),"muted")+"</div>";}
function renderFund(){var fw=fundamentalWrap(),fd=fundamental(),forecast=fd.performance_forecast||{},notices=arr(fd.notices).slice(0,5),unlocks=arr(fd.unlocks).slice(0,5);$("fund-panel").innerHTML="<h3>基本面与风险事件</h3>"+metricGrid([["基本面分",esc(f(fw.fundamental_score,1))],["风险等级",'<span class="badge '+(fw.risk_level==="high"?"exit":fw.risk_level==="medium"?"trim":"buy")+'">'+esc(fw.risk_level||"—")+"</span>"],["PE(TTM) / PB",esc(f(fd.valuation&&fd.valuation.pe_ttm,1)+" / "+f(fd.valuation&&fd.valuation.pb,2))],["市值 / 流通市值",esc(fm(fd.valuation&&fd.valuation.market_cap)+" / "+fm(fd.valuation&&fd.valuation.float_market_cap))],["ROE / 毛利率",esc(fp(fd.financial&&fd.financial.roe_pct)+" / "+fp(fd.financial&&fd.financial.gross_margin_pct))],["营收/利润同比",esc(fp(fd.financial&&fd.financial.revenue_yoy_pct)+" / "+fp(fd.financial&&fd.financial.profit_yoy_pct))],["负债率 / 商誉占净资产",esc(fp(fd.financial&&fd.financial.debt_ratio_pct)+" / "+fp(fd.financial&&fd.financial.goodwill_net_assets_ratio_pct))],["业绩预告",esc(forecast.forecast_type?forecast.forecast_type+" "+fp(forecast.change_pct):"暂无")]])+'<div class="evi">'+evidenceBox("支持证据",arr(fw.support_evidence),"green")+evidenceBox("风险事件",arr(fw.risk_events).concat(notices.map(function(n){return (n.date||"")+" "+(n.title||n.type||"");})).filter(Boolean),"amber")+evidenceBox("解禁/质押/缺失",arr(fw.opposing_evidence).concat(unlocks.map(function(u){return (u.unlock_date||u.date||"")+" 解禁 "+(u.unlock_ratio_pct?fp(u.unlock_ratio_pct):"");}),arr(fw.missing_data)).filter(Boolean),"muted")+"</div>";}
function renderBoard(){var factors=arr(DETAIL&&DETAIL.global_factors),concepts=arr(DETAIL&&DETAIL.concepts&&DETAIL.concepts.concept_tags).map(tagName).filter(Boolean);var body=factors.length?factors.map(function(x){var impact=x.impact==="positive"?"偏多":x.impact==="negative"?"偏空":"中性",cls=x.impact==="positive"?"buy":x.impact==="negative"?"exit":"trim";return "<tr><td>"+esc(x.sector||"相关因子")+'</td><td><span class="badge '+cls+'">'+impact+'</span></td><td class="num">'+f(x.score,1)+"</td><td>"+esc(arr(x.drivers).slice(0,3).join(" · ")||x.note||"—")+"</td></tr>";}).join(""):'<tr><td colspan="4" class="empty">暂无匹配的海外联动因子</td></tr>';$("board-panel").innerHTML='<h3>板块强度与海外联动</h3><div class="side-row"><span>所属方向</span><b>'+esc(sectorName())+'</b></div><div class="side-row"><span>概念标签</span><b>'+(concepts.length?concepts.map(esc).join(" · "):"暂无")+'</b></div><table class="table" style="margin-top:10px"><thead><tr><th>海外/消息因子</th><th>影响</th><th class="num">分数</th><th>驱动说明</th></tr></thead><tbody>'+body+'</tbody></table><div class="note">海外因子用于盘前和早盘情景判断，例如美股半导体、日韩科技链、汇率与大宗商品等，只作为板块强弱的辅助证据。</div>';}
function renderHistory(){var h=history(),records=arr(h.records),obs=arr(h.fixed_observations),sample=num(h.entry_reached_samples)||0,mature=sample>=30,hitRate=mature&&sample?((num(h.target_hit_samples)||0)/sample*100):null;var rows=records.length?records.slice(0,20).map(function(r){return "<tr><td>"+esc(String(r.first_seen_at||"").slice(0,16))+"</td><td>"+esc(r.recommendation_type||"—")+'</td><td><span class="badge '+(r.status==="target_hit"?"buy":r.status==="invalidated"?"exit":"trim")+'">'+esc(statusText(r.status))+'</span></td><td class="num up">'+fp(r.mfe_pct)+'</td><td class="num down">'+fp(r.mae_pct)+"</td><td>"+esc(r.close_reason||"—")+"</td></tr>";}).join(""):'<tr><td colspan="6" class="empty">暂无生命周期记录</td></tr>';$("hist-panel").innerHTML='<h3>历史推荐表现</h3><div class="history-head"><div><div class="big">'+(hitRate===null?"样本不足":fp(hitRate,1))+'</div><div class="muted" style="font-size:12px">'+(hitRate===null?"不展示胜率":"目标触达率，仅历史事实")+'</div></div><div class="muted" style="font-size:12.5px;line-height:1.9">总样本 '+(h.samples||0)+" · 入场触达 "+(h.entry_reached_samples||0)+" ("+fp(h.entry_reached_pct)+")<br>平均 MFE "+fp(h.average_mfe_pct)+" · 平均 MAE "+fp(h.average_mae_pct)+" · 目标 "+(h.target_hit_samples||0)+" · 失效 "+(h.invalidated_samples||0)+'</div></div><table class="table"><thead><tr><th>首次出现</th><th>类型</th><th>状态</th><th class="num">MFE</th><th class="num">MAE</th><th>关闭原因</th></tr></thead><tbody>'+rows+'</tbody></table>'+(obs.length?'<div class="note">固定观察样本：'+obs.slice(0,5).map(function(o){return esc(o.horizon||"")+" MFE "+fp(o.mfe_pct)+" / MAE "+fp(o.mae_pct);}).join("；")+"</div>":"")+'<div class="note">'+esc(h.note||"样本不足时不展示胜率，仅展示 MFE/MAE、触达与失效事实。")+"</div>";}
function renderAccounts(){var rows=accounts();$("acct-panel").innerHTML='<h3>账户持仓/关注</h3><table class="table"><thead><tr><th>账户</th><th class="num">成本/现价</th><th class="num">持股/可用</th><th class="num">市值</th><th class="num">盈亏</th><th>状态</th></tr></thead><tbody>'+(rows.length?rows.map(function(r){return "<tr><td>"+esc(r.account_name||r.account_id||"账户")+'</td><td class="num">'+f(r.average_cost)+" / "+f(r.current_price)+'</td><td class="num">'+fm(r.quantity)+" / "+fm(r.available_quantity)+'</td><td class="num">'+fm(r.market_value)+'</td><td class="num '+(num(r.pnl)>=0?"up":"down")+'">'+fm(r.pnl)+'<br><span class="muted">'+fp(r.pnl_pct)+'</span></td><td>'+esc(r.status||r.side||"持仓")+"</td></tr>";}).join(""):'<tr><td colspan="6" class="empty">该股票当前不在账户持仓中；如只加入自选，应在首页多账户中心维护关注。</td></tr>')+"</tbody></table>";}
function renderSide(){var rows=[["现价",f(latestPrice())],["买入/关注区",LEVELS.entry_low!==null||LEVELS.entry_high!==null?f(LEVELS.entry_low)+" - "+f(LEVELS.entry_high):"—"],["最大追价",f(LEVELS.max_chase)],["失效价",f(LEVELS.invalid)],["目标价",f(LEVELS.target)],["支撑/压力",f(LEVELS.support)+" / "+f(LEVELS.resistance)]];$("level-list").innerHTML=rows.map(function(r){return '<div class="side-row"><span>'+esc(r[0])+"</span><b>"+esc(r[1])+"</b></div>";}).join("");var sig=primarySignal(),rec=recommendation(),tasks=[["主动作",actionText(sig.action||(rec.recommendation_status==="recommend"?"buy":"hold"))],["入场纪律",LEVELS.entry_high!==null?"不高于 "+f(LEVELS.entry_high)+" 优先":"等待价格进入计划区"],["止损纪律",LEVELS.invalid!==null?"跌破 "+f(LEVELS.invalid)+" 重新评估":"缺失失效价，轻仓观察"],["防卖飞",sig.tolerance!=null?"趋势容忍回撤 "+fp(sig.tolerance):"按趋势强弱动态收紧/放宽"]];$("action-list").innerHTML=tasks.map(function(r){return '<div class="side-row"><span>'+esc(r[0])+"</span><b>"+esc(r[1])+"</b></div>";}).join("");var fw=fundamentalWrap(),d=diagnosis();$("quality-list").innerHTML=[["技术数据",d.data_quality||DETAIL&&DETAIL.data_quality||"—"],["基本面数据",fw.data_quality||"—"],["推荐快照",rec.generated_at?String(rec.generated_at).slice(0,16):"—"],["详情更新时间",DETAIL&&DETAIL.generated_at?String(DETAIL.generated_at).slice(0,16):"—"]].map(function(r){return '<div class="side-row"><span>'+esc(r[0])+"</span><b>"+esc(r[1])+"</b></div>";}).join("");}
function renderAll(){buildLevels();renderHeader();renderDecision();renderSignals();renderTech();renderFund();renderBoard();renderHistory();renderAccounts();renderSide();drawKline();}
function normalizeBars(raw){return arr(raw&&raw.bars).map(function(b){return {time:b.time||b.date,o:num(b.open),h:num(b.high),l:num(b.low),c:num(b.close),v:num(b.volume)};}).filter(function(b){return [b.o,b.h,b.l,b.c].every(function(x){return x!==null;});});}
async function loadChart(period){PERIOD=period;document.querySelectorAll(".pill[data-period]").forEach(function(b){b.classList.toggle("active",b.dataset.period===period);});var raw=await getJson("/api/stocks/"+encodeURIComponent(symbol)+"/chart?period="+encodeURIComponent(period)+"&limit=160");BARS=normalizeBars(raw);$("chart-title").textContent=(period==="1d"?"日线":"5分钟")+" · 关键价位叠加";if(DETAIL)renderAll();}
async function loadAll(){if(!validSymbol(symbol))throw new Error("请在地址中提供 6 位股票代码，例如 /stock?symbol=002371");DETAIL=await getJson("/api/stocks/"+encodeURIComponent(symbol)+"/detail");await loadChart(PERIOD);$("content").style.display="block";$("status").textContent="已连接真实接口 · "+new Date().toLocaleTimeString("zh-CN",{hour12:false});}
function drawKline(){var cv=$("kline"),ctx=cv.getContext("2d"),dpr=window.devicePixelRatio||1,cssW=cv.clientWidth||960,cssH=cv.clientHeight||360;cv.width=Math.max(1,Math.floor(cssW*dpr));cv.height=Math.max(1,Math.floor(cssH*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);var W=cssW,H=cssH,padL=10,padR=72,padT=16,padB=24,css=getComputedStyle(document.documentElement),color=function(k){return css.getPropertyValue(k).trim();};ctx.clearRect(0,0,W,H);ctx.font='11px "Microsoft YaHei"';ctx.textBaseline="middle";if(!BARS.length){ctx.fillStyle=color("--muted");ctx.textAlign="center";ctx.fillText("暂无K线数据",W/2,H/2);return;}var priceValues=[];BARS.forEach(function(b){priceValues.push(b.h,b.l);});Object.keys(LEVELS).forEach(function(k){var v=num(LEVELS[k]);if(v!==null)priceValues.push(v);});var min=Math.min.apply(null,priceValues),max=Math.max.apply(null,priceValues);if(!Number.isFinite(min)||!Number.isFinite(max)||min===max){min=(BARS[0].c||1)*0.95;max=(BARS[0].c||1)*1.05;}var extra=(max-min)*0.08;min-=extra;max+=extra;var span=max-min,x=function(i){return padL+(BARS.length===1?0.5:i/(BARS.length-1))*(W-padL-padR);},y=function(v){return padT+(1-(v-min)/span)*(H-padT-padB);};ctx.strokeStyle="rgba(255,255,255,.055)";ctx.fillStyle=color("--muted");ctx.lineWidth=1;for(var g=0;g<=4;g++){var v=min+span*g/4,yy=y(v);ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke();ctx.textAlign="left";ctx.fillText(v.toFixed(2),W-padR+8,yy);}function band(lo,hi,fill){if(lo===null||hi===null)return;var a=Math.min(lo,hi),b=Math.max(lo,hi);ctx.fillStyle=fill;ctx.fillRect(padL,y(b),W-padL-padR,y(a)-y(b));}band(LEVELS.entry_low,LEVELS.entry_high,color("--buy-bg"));band(LEVELS.supply_low,LEVELS.supply_high,color("--supply-bg"));function hline(v,c,label,dash){v=num(v);if(v===null)return;var yy=y(v);ctx.save();ctx.strokeStyle=c;ctx.setLineDash(dash?[5,4]:[]);ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke();ctx.fillStyle=c;ctx.textAlign="right";ctx.fillText(label+" "+v.toFixed(2),W-padR-4,yy-8);ctx.restore();}hline(LEVELS.invalid,color("--red"),"失效",false);hline(LEVELS.target,color("--blue"),"目标",false);hline(LEVELS.support,color("--muted"),"支撑",true);hline(LEVELS.resistance,color("--amber"),"压力",true);hline(LEVELS.max_chase,color("--purple"),"追价上限",true);var step=(W-padL-padR)/Math.max(BARS.length,1),cw=Math.max(3,Math.min(12,step*.58));BARS.forEach(function(b,i){var xx=x(i),up=b.c>=b.o,cc=up?color("--up"):color("--down");ctx.strokeStyle=cc;ctx.fillStyle=cc;ctx.beginPath();ctx.moveTo(xx,y(b.h));ctx.lineTo(xx,y(b.l));ctx.stroke();var top=y(Math.max(b.o,b.c)),bot=y(Math.min(b.o,b.c));ctx.fillRect(xx-cw/2,top,cw,Math.max(1,bot-top));});ctx.fillStyle=color("--muted");ctx.textAlign="left";ctx.fillText(String(BARS[0].time||"").slice(5,16),padL,H-10);ctx.textAlign="right";ctx.fillText(String(BARS[BARS.length-1].time||"").slice(5,16),W-padR,H-10);}
document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#tabs button").forEach(function(x){x.classList.remove("active");});document.querySelectorAll(".pane").forEach(function(x){x.classList.remove("active");});b.classList.add("active");$("pane-"+b.dataset.tab).classList.add("active");};});
